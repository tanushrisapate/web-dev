<!DOCTYPE html>
<html>
  <head>
    <title>Calclator</title>
  </head>
  <body>
    <p>
      Calculator
    </p>
    <p>
      <button onclick="
        v = v*10 +1;
        console.log(v);
        ">1</button>

      <button onclick="
        v = v*10 +2;
        console.log(v);
      ">2</button>

      <button onclick="
        v = v*10+3;
        console.log(v);
      ">3</button>

      <button onclick="
        console.log(`${v} +`);
        
      ">+</button>
    </p>
    <p>
      <button onclick="
        v = v*10 +4;
        console.log(v);
        ">4</button>

      <button onclick="
        v = v*10 +5;
        console.log(v);
        ">5</button>

      <button onclick="
        v = v*10 +6;
        console.log(v);
        ">6</button>

      <button onclick="
        console.log('-');
      ">-</button>
    </p>
    <p>
      <button onclick="
        v = v*10 +7;
        console.log(v);
        ">7</button>

      <button onclick="
        v = v*10 +8;
        console.log(v);
        ">8</button>

      <button onclick="
        v = v*10 +9;
        console.log(v);
        ">9</button>

      <button onclick="
        console.log('*');
      ">*</button>

    </p>
    <p>
      <button onclick="
        v = v*10 +1;
        console.log(v);
        ">0</button>

      <button onclick="
        v = v*10 +1;
        console.log(v);
        ">.</button>

      <button onclick="
        v = v*10 +1;
        console.log(v);
        ">=</button>

      <button onclick="
        v = v*10 +1;
        console.log(v);
        ">/</button>

    </p>
    <button>Clear</button>
  </body>
  <script>
    var v =0;
   </script>
</html>
